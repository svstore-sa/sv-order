<style>

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
.top{background:var(--brand);color:#fff}
.top .in{max-width:1100px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}

.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;min-width:0}
.card h2{margin:0;font-size:17px;color:var(--brand)}

.types button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:right;border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;min-height:70px;background:#f6f8f6;color:var(--ink);border:2px solid var(--line)}
.types button b{font-size:16px}.types button span{font-size:12.5px;opacity:.8}
.types button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

textarea{min-height:80px;resize:vertical}

.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--brand-dk)}.btn[disabled]{opacity:.55;cursor:wait}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.red{background:#c62828}.btn.red:hover{background:#a51f1f}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:7px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px}
.okbox{background:var(--tint);color:var(--brand);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.okbox b{font-size:19px}
.list{display:grid;gap:8px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.it .t{display:grid;gap:1px;min-width:0}.it .t small{color:var(--muted);font-size:12px}
.badge{border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.b-mgr{background:var(--warn-bg);color:var(--warn)}.b-adm{background:var(--info-bg);color:var(--info)}.b-ok{background:var(--tint);color:var(--brand)}.b-no{background:var(--bad-bg);color:var(--bad)}

.bal div{background:#f6f8f6;border-radius:8px;padding:10px;display:grid}.bal span{font-size:12px;color:var(--muted)}.bal b{font-size:20px}
.kv{display:grid;gap:4px;background:#f6f8f6;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.kv div{display:flex;gap:10px}.kv span{color:var(--muted);min-width:120px;flex:0 0 auto}
.files{display:grid;gap:4px}.files div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#f6f8f6;font-size:12.5px;color:var(--muted);position:sticky;top:0}
tr.dept td{background:var(--tint);color:var(--brand);font-weight:700}
td.n{text-align:center;font-variant-numeric:tabular-nums}
tr.emp{cursor:pointer}tr.emp:hover td{background:#fafcfb}
tr.det td{background:#fbfcfb}
.mon{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mon b{font-size:17px;min-width:130px;text-align:center}
.testbar{background:#fff8ec;border:1px solid #f0d9a8;color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13.5px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:auto;accent-color:var(--brand)}
</style>

    h+='<div class="tbl"><table><thead><tr><th>الموظف</th>'+TYPES.map(function(t){return '<th class="n">'+t.ar+'</th>'}).join("")+'<th class="n">معلّق</th><th class="n">مرفوض</th></tr></thead><tbody>';
    Object.keys(depts).sort().forEach(function(dp){h+='<tr class="dept"><td colspan="'+(cols.length+3)+'">'+esc(dp)+'</td></tr>';depts[dp].sort(function(a,b){return String(a.Title).localeCompare(b.Title)}).forEach(function(e){var rs=by[e.PayNo]||[],c={},pend=0,rej=0;rs.forEach(function(r){if(r.SStatus==="مرفوض"){rej++;return}if(r.SStatus!=="معتمد")pend++;c[r.ReqType]=(c[r.ReqType]||0)+1});
      h+='<tr class="emp" data-p="'+esc(e.PayNo)+'"><td><b>'+esc(e.Title)+'</b><br><small class="muted ltr">'+esc(e.PayNo)+'</small></td>'+cols.map(function(t){return '<td class="n">'+(c[t]||"")+'</td>'}).join("")+'<td class="n">'+(pend||"")+'</td><td class="n">'+(rej||"")+'</td></tr>';
      if(AD.open[e.PayNo])h+='<tr class="det"><td colspan="'+(cols.length+3)+'">'+(rs.length?'<div class="list">'+rs.map(function(r){return '<div class="it"><div class="t"><span><b>'+esc(r.TypeAr)+'</b>'+(r.SubType?' · '+esc(r.SubType):'')+(qtyTxt(r)?' · '+qtyTxt(r):'')+'</span><small>'+when(r)+' · <span class="ltr">'+esc(r.Title)+'</span></small>'+(r.Reason?'<small>'+esc(r.Reason)+'</small>':'')+(r.MgrResp||r.AdmResp?'<small>ملاحظات: '+esc([r.MgrResp,r.AdmResp].filter(Boolean).join(" / "))+'</small>':'')+(r.Files?'<small>'+safeLinks(r.Files)+'</small>':'')+'</div>'+badge(r.SStatus)+'</div>'}).join("")+'</div>':'<span class="muted">ما فيه طلبات هذا الشهر.</span>')+'</td></tr>'})});
    var orphan=D.reqs.filter(function(r){return !D.emps.some(function(e){return e.PayNo===r.EmpPayNo})});if(orphan.length)h+='<tr class="dept"><td colspan="'+(cols.length+3)+'">طلبات بدون موظف في القائمة: '+orphan.length+'</td></tr>';
    h+='</tbody></table></div><p class="muted" style="margin:0">اضغط على اسم الموظف عشان تشوف كل طلباته في الشهر.</p></section>'}
  if(AD.tab==="pend"){h+='<section class="card"><h2>تنتظر اعتمادك النهائي ('+D.pend.length+')</h2>'+(D.pend.length?'<div class="list">'+D.pend.map(function(r){var base=PAGE+"?d="+encodeURIComponent(r.Title)+"&t="+encodeURIComponent(r.AdmToken)+"&back="+encodeURIComponent(location.href);return '<div class="it" style="align-items:flex-start;flex-wrap:wrap"><div class="t"><span><b>'+esc(r.EmpName)+'</b> · '+esc(r.TypeAr)+(qtyTxt(r)?' · '+qtyTxt(r):'')+'</span><small>'+esc(r.Dept)+' · '+when(r)+' · <span class="ltr">'+esc(r.Title)+'</span></small>'+(r.Reason?'<small>'+esc(r.Reason)+'</small>':'')+'<small>وافق: '+esc(r.MgrName)+(r.MgrResp?' — '+esc(r.MgrResp):'')+'</small></div><div class="row"><a class="btn sm" href="'+esc(base+"&a=ok")+'">✓ اعتماد</a><a class="btn red sm" href="'+esc(base+"&a=no")+'">✗ رفض</a></div></div>'}).join("")+'</div>':'<p class="muted" style="margin:0">ما فيه شي ينتظرك 👌</p>')+'</section>'}
  if(AD.tab==="emps"){h+='<section class="card"><div class="row" style="justify-content:space-between"><h2>الموظفين ('+D.emps.length+')</h2><span class="muted">اضغط «أرسل الرابط» جنب كل موظف بالترتيب اللي تبغاه — الضغطة الثانية تأكيد.</span></div><div id="lmsg"></div><div class="tbl"><table><thead><tr><th>الموظف</th><th>الإدارة</th><th>المدير المباشر</th><th>الإيميل</th><th>الرابط</th><th class="n">سنوية</th><th class="n">كوم تايم</th><th>الإرسال</th></tr></thead><tbody>'+D.emps.slice().sort(function(a,b){return String(a.Dept).localeCompare(b.Dept)||String(a.Title).localeCompare(b.Title)}).map(function(e){return '<tr><td><b>'+esc(e.Title)+'</b><br><small class="muted ltr">'+esc(e.PayNo)+'</small></td><td>'+esc(e.Dept)+'</td><td>'+esc(e.MgrName)+'</td><td style="font-size:12.5px"><span class="ltr">'+esc(e.Email)+'</span></td><td>'+(e.LinkSent?'<span class="badge b-ok">انرسل '+esc(String(e.LinkSent).slice(0,10))+'</span>':'<span class="badge b-mgr">ما انرسل</span>')+'</td><td class="n">'+esc(e.AnnualBal==null?"—":e.AnnualBal)+'</td><td class="n">'+esc(e.CompBal==null?"—":e.CompBal)+'</td><td><button type="button" class="btn sm one'+(e.LinkSent?' ghost':'')+'" data-p="'+esc(e.PayNo)+'" data-n="'+esc(e.Title)+'">'+(e.LinkSent?"أرسل مرة ثانية":"أرسل الرابط")+'</button></td></tr>'}).join("")+'</tbody></table></div><p class="muted" style="margin:0">الأرصدة تتعدل من قائمة DW_Employees في SharePoint.</p></section>'}
  APP.innerHTML=h;
  if(AD.tab==="month"){$("mPrev").onclick=function(){shiftM(-1)};$("mNext").onclick=function(){shiftM(1)};[].forEach.call(document.querySelectorAll("tr.emp"),function(tr){tr.onclick=function(){var p=tr.getAttribute("data-p");AD.open[p]=!AD.open[p];drawAdmin()}})}
  if(AD.tab==="emps"){[].forEach.call(document.querySelectorAll("button.one"),function(b){b.onclick=function(){sendLinks(b)}})}}
function linkMail(){var inner='<p style="margin:0 0 8px">السلام عليكم <b>__NAME__</b>،<br>من اليوم تقدر ترفع طلبات الحضور والانصراف من صفحتك الخاصة «دوامي»، وتوصل لمديرك مباشرة.</p>'+mKV([["الاسم","<b>__NAME__</b>",1],["رقم الراتب",'<span dir="ltr">__PAY__</span>',1],["الإدارة","__DEPT__",1],["المدير المباشر","__MGR__",1]])+'<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:10px 0"><tr><td align="center" style="background:#006937;border-radius:8px"><a href="__LINK__" style="display:block;color:#ffffff;text-decoration:none;font-weight:bold;font-size:18px;padding:15px">افتح صفحة طلباتي</a></td></tr></table><div style="font-size:13px;color:#33403a;margin:6px 0">تصحيح بصمة · مهمة عمل · إجازة مرضية · إجازة · أوفر تايم · كوم تايم · ومتابعة طلباتك</div><div style="background:#fff8ec;border:1px solid #f0d9a8;border-radius:6px;padding:10px 14px;margin:6px 0"><div><b style="color:#8a4b00">📌 احفظ هذا الإيميل</b> أو ثبّت الرابط في المفضلة على جوالك.</div><div><b style="color:#8a4b00">🔒 الرابط شخصي لك</b> – لا ترسله لأحد، لأن أي طلب منه ينرفع باسمك.</div></div><p style="margin:0;font-size:13px;color:#5b6b62">بياناتك فيها غلط؟ أو ضيّعت الرابط؟ رد على هذا الإيميل.</p>';return mWrap("صفحة طلباتك جاهزة","دوامي · Group Marketing","#006937",inner)}
function sendLinks(b){var p=b.getAttribute("data-p"),nm=b.getAttribute("data-n");
  if(b.getAttribute("data-c")!=="1"){[].forEach.call(document.querySelectorAll("button.one[data-c='1']"),function(x){x.setAttribute("data-c","");x.textContent=x.getAttribute("data-l");x.classList.remove("red")});b.setAttribute("data-l",b.textContent);b.setAttribute("data-c","1");b.classList.add("red");b.textContent="تأكيد: أرسل لـ "+String(nm).split(" ")[0]+"؟";return}
  b.disabled=true;b.textContent="جاري الإرسال…";
  post({mode:"dwlink",k:AD.k,pay:p,subject:"رابطك الخاص في «دوامي» · __NAME__",mail:linkMail()}).then(function(j){var msg;if(j.ok){AD.data.emps.forEach(function(x){if(x.PayNo===p)x.LinkSent=new Date(Date.now()+3*36e5).toISOString()});msg='<div class="okbox"><b>✓ انرسل لـ '+esc(nm)+'</b><span>'+(j.test?"وضع التجربة: راح لإيميلك أنت بدل إيميله.":"راح لإيميله.")+'</span></div>'}else msg='<div class="err">ما انرسل لـ '+esc(nm)+' ('+esc(j.err||"خطأ")+')</div>';drawAdmin();$("lmsg").innerHTML=msg}).catch(function(){drawAdmin();$("lmsg").innerHTML='<div class="err">تعذر الاتصال.</div>'})}

/* ---------- router ---------- */
if(Q.get("k"))empPage();
else if(Q.get("m")&&Q.get("t"))decidePage("mgr");
else if(Q.get("d")&&Q.get("t"))decidePage("adm");
else if(Q.get("ak"))adminPage();
else APP.innerHTML='<div class="card"><h2>دوامي</h2><p>افتح الصفحة من الرابط الخاص اللي وصلك على الإيميل.</p></div>';
</script>
